# ============================================================
# SAM CLI configuration — Root stack
# Run: cd backend && sam deploy
# Store the Google client secret once in Secrets Manager:
#   aws secretsmanager create-secret --name gsep/google-client-secret --secret-string "..."
# ============================================================
version = 0.1

[default.global.parameters]
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities      = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
resolve_s3        = false
s3_bucket         = "gsep-platform-deployments-008349342377"
stack_name        = "GEP"
s3_prefix         = "GEP"
# Do not put plaintext OAuth client secrets here.
parameter_overrides = "StageName=\"Prod\" AdminEmail=\"admin@gep.com\" AdminPassword=\"admin123!\" AdminApiKey=\"53d1a2703d76b17c5fd1c9ddeb884572bb1de30956bdc2f1d27df074bf0503e5\" DefaultBatchSize=\"100\" PurchasingCapacity=\"10000\" CognitoDomainPrefix=\"global-event-platform-008349342377\" OAuthCallbackUrls=\"https://global-event-platform.vercel.app/\" OAuthLogoutUrls=\"https://global-event-platform.vercel.app/\" GoogleClientId=\"151896926880-hqfs0hj49jddgpqolkfc1j7snk27cfd7.apps.googleusercontent.com\" GoogleClientSecretId=\"gsep/google-client-secret\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"
port = 3001

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
