# ============================================================
# SAM CLI configuration — Root stack
# Run: cd backend && sam deploy
# Override secrets on CLI:
#   sam deploy --parameter-overrides AdminEmail=... AdminApiKey=...
# ============================================================
version = 0.1

[default.global.parameters]
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities      = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
resolve_s3        = false
s3_bucket         = "gsep-platform-deployments-008349342377"
stack_name        = "GEP"
s3_prefix         = "GEP"
# Fill in real values — do NOT commit secrets here; use samconfig.local.toml (gitignored)
parameter_overrides = "StageName=\"Prod\" AdminEmail=\"admin@gsep.com\" AdminPassword=\"admin123!\" AdminApiKey=\"replace-with-real-key\" DefaultBatchSize=\"100\" PurchasingCapacity=\"10000\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"
port = 3001

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
